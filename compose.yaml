services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: briotap
      POSTGRES_USER: briotap
      POSTGRES_PASSWORD: briotap
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U briotap -d briotap']
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres_data:
