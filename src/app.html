<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				const theme = localStorage.getItem('briotap:theme');
				document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
			} catch {
				document.documentElement.dataset.theme = 'dark';
			}
		</script>
		<link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
